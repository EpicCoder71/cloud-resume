<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" role="img"><title>CloudFront Screening Premiere</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#153955"/></marker></defs><rect width="1680" height="980" fill="#fff"/><text x="840" y="64" font-family="Arial,Helvetica,sans-serif" font-size="43" fill="#081936" font-weight="700" text-anchor="middle">CloudFront Screening Premiere</text><text x="840" y="108" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#5b6b83" font-weight="400" text-anchor="middle">Private Screening Content · Signed URLs · Origin Access Control · AWS WAF</text><rect x="25" y="145" width="360" height="700" rx="13" fill="#f7f8fb" stroke="#99a7ba" stroke-width="2"/><text x="47" y="181" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#081936" font-weight="700" text-anchor="start">Reviewers &amp; signing</text><rect x="45" y="220" width="320" height="140" rx="9" fill="#fff" stroke="#9baac0" stroke-width="1.5"/><g transform="translate(59,238)"><rect width="64" height="64" rx="9" fill="#dd344c"/><g fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"><circle cx="23" cy="26" r="12"/><path d="M34 26h23v9h-8v7h-9V26M18 26h2"/></g></g><text x="139" y="256" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#081936" font-weight="700" text-anchor="start">Local signing tool</text><text x="139" y="284" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Private RSA key</text><text x="139" y="309" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">15-minute links by default</text><rect x="45" y="505" width="320" height="130" rx="9" fill="#fff" stroke="#9baac0" stroke-width="1.5"/><g transform="translate(59,523)"><rect width="64" height="64" rx="9" fill="#334155"/><g fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"><path d="M14 12h36v29H14zM8 49h48l-6-8H14z"/></g></g><text x="139" y="541" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#081936" font-weight="700" text-anchor="start">Reviewer browser</text><text x="139" y="569" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Signed URL required</text><text x="139" y="594" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">HTTPS request</text><polyline points="205,360 205,505" fill="none" stroke="#153955" stroke-width="2.3" marker-end="url(#a)"/><text x="65" y="440" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Share signed URL</text><rect x="420" y="145" width="1235" height="700" rx="13" fill="#fffaf4" stroke="#ff9900" stroke-width="2"/><text x="442" y="181" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#081936" font-weight="700" text-anchor="start">AWS Cloud | CloudFront global edge + S3 in us-east-1</text><rect x="445" y="215" width="605" height="420" rx="13" fill="#faf7ff" stroke="#8c4fff" stroke-width="2"/><text x="467" y="251" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#081936" font-weight="700" text-anchor="start">Viewer security | global edge</text><rect x="470" y="280" width="555" height="125" rx="9" fill="#fff" stroke="#9baac0" stroke-width="1.5"/><g transform="translate(484,298)"><rect width="64" height="64" rx="9" fill="#dd344c"/><g fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"><path d="M32 7l21 8v18q-2 16-21 25Q13 49 11 33V15zM23 27h18v17H23zM27 27v-5a5 5 0 0110 0v5"/></g></g><text x="564" y="316" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#081936" font-weight="700" text-anchor="start">AWS WAF</text><text x="564" y="344" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Header block · IP rate limit</text><text x="564" y="369" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">GET / HEAD method filtering</text><rect x="470" y="475" width="555" height="125" rx="9" fill="#fff" stroke="#9baac0" stroke-width="1.5"/><g transform="translate(484,493)"><rect width="64" height="64" rx="9" fill="#8c4fff"/><g fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"><path d="M32 8l23 13v24L32 58 9 45V21zM9 21l23 13 23-13M32 34v24M21 15l23 13v24"/></g></g><text x="564" y="511" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#081936" font-weight="700" text-anchor="start">Amazon CloudFront</text><text x="564" y="539" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Trusted public-key group</text><text x="564" y="564" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Validate signature + expiration</text><polyline points="365,565 435,565 435,342 470,342" fill="none" stroke="#153955" stroke-width="2.3" marker-end="url(#a)"/><text x="380" y="460" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">HTTPS</text><polyline points="745,405 745,475" fill="none" stroke="#153955" stroke-width="2.3" marker-end="url(#a)"/><text x="765" y="445" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Allowed requests</text><rect x="1130" y="475" width="490" height="140" rx="9" fill="#fff" stroke="#9baac0" stroke-width="1.5"/><g transform="translate(1144,493)"><rect width="64" height="64" rx="9" fill="#3f8624"/><g fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"><ellipse cx="32" cy="17" rx="17" ry="6"/><path d="M15 17l4 32q13 10 26 0l4-32M19 48q13-8 26 0"/></g></g><text x="1224" y="511" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#081936" font-weight="700" text-anchor="start">Private S3 origin</text><text x="1224" y="539" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Synthetic screening content</text><text x="1224" y="564" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Public access blocked · SSE-S3</text><text x="1224" y="589" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Bucket policy: distribution ARN</text><polyline points="1025,540 1130,540" fill="none" stroke="#153955" stroke-width="2.3" marker-end="url(#a)"/><text x="1055" y="508" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">OAC</text><text x="1063" y="579" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">SigV4</text><rect x="1130" y="280" width="490" height="120" rx="9" fill="#fff" stroke="#9baac0" stroke-width="1.5"/><g transform="translate(1144,298)"><rect width="64" height="64" rx="9" fill="#dd344c"/><g fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"><circle cx="32" cy="22" r="9"/><path d="M15 51v-7q0-12 17-12t17 12v7z"/></g></g><text x="1224" y="316" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#081936" font-weight="700" text-anchor="start">Origin Access Control</text><text x="1224" y="344" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">CloudFront signs origin requests</text><text x="1224" y="369" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">Always sign · HTTPS to S3</text><polyline points="1375,400 1375,475" fill="none" stroke="#153955" stroke-width="2.3" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="470" y="695" width="555" height="110" rx="9" fill="#fff" stroke="#9baac0" stroke-width="1.5"/><g transform="translate(484,713)"><rect width="64" height="64" rx="9" fill="#e7157b"/><g fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"><path d="M15 12h29v40H15zM23 22h13M23 30h13M23 38h8"/><circle cx="43" cy="43" r="10"/><path d="M50 50l8 8"/></g></g><text x="564" y="731" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#081936" font-weight="700" text-anchor="start">WAF visibility</text><text x="564" y="759" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#153955" font-weight="400" text-anchor="start">CloudWatch metrics + sampled requests</text><polyline points="745,635 745,695" fill="none" stroke="#153955" stroke-width="2.3" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="1135" y="715" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#b42338" font-weight="700" text-anchor="start">Anonymous direct S3 access: denied</text><text x="1135" y="750" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#153955" font-weight="400" text-anchor="start">Unsigned or expired viewer URL: denied</text><text x="1135" y="785" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#153955" font-weight="400" text-anchor="start">Default CloudFront hostname provides TLS</text><path d="M35 915H1645" stroke="#9baac0"/><text x="840" y="952" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#465b78" font-weight="700" text-anchor="middle">Viewer authorization ≠ origin authorization • Private signing key stays local • AWS deployment pending</text></svg>