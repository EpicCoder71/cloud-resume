<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>CloudFront Screening Premiere</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#62d9bd" stroke-width="1.5"/></marker></defs><rect width="1200" height="560" rx="20" fill="#08111e"/><text x="50" y="65" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">CloudFront Screening Premiere</text><text x="50" y="100" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="17">Private premiere content · signed viewer access · protected S3 origin</text><path d="M300 250 L440 250" stroke="#62d9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="370.0" y="238.0" fill="#62d9bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">HTTPS</text><path d="M760 250 L900 250" stroke="#62d9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="830.0" y="238.0" fill="#62d9bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">OAC / SigV4</text><path d="M600 390 L600 355" stroke="#62d9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="360.5" fill="#62d9bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="14"></text><rect x="45" y="190" width="255" height="135" rx="12" fill="#122338" stroke="#36546b"/><text x="172.5" y="225" text-anchor="middle" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="18">Reviewer browser</text><text x="172.5" y="252" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Time-limited signed URL</text><text x="172.5" y="279" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">HTTPS delivery</text><rect x="440" y="165" width="320" height="190" rx="12" fill="#122338" stroke="#36546b"/><text x="600.0" y="200" text-anchor="middle" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="18">CloudFront + AWS WAF</text><text x="600.0" y="227" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Trusted public-key group</text><text x="600.0" y="254" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Header / rate / method rules</text><text x="600.0" y="281" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Origin Access Control</text><rect x="900" y="190" width="255" height="135" rx="12" fill="#122338" stroke="#36546b"/><text x="1027.5" y="225" text-anchor="middle" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="18">Private S3 bucket</text><text x="1027.5" y="252" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Public access blocked</text><text x="1027.5" y="279" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">SSE-S3 encryption</text><rect x="440" y="390" width="320" height="80" rx="12" fill="#122338" stroke="#36546b"/><text x="600.0" y="425" text-anchor="middle" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="18">Local signing tool</text><text x="600.0" y="452" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Private RSA key stays local</text><text x="50" y="520" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Anonymous direct S3 access denied. Synthetic screening content. AWS deployment pending.</text></svg>