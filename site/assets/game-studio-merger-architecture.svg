<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Game Studio Merger</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#62d9bd" stroke-width="1.5"/></marker></defs><rect width="1200" height="560" rx="20" fill="#08111e"/><text x="50" y="65" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="30" font-weight="bold">Game Studio Merger</text><text x="50" y="100" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="17">Private connectivity between two game studios · us-east-1 · same Availability Zone</text><path d="M385 245 L815 245" stroke="#62d9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="233.0" fill="#62d9bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">VPC peering · asset request</text><path d="M220 320 L405 405" stroke="#62d9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="312.5" y="350.5" fill="#62d9bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="14"></text><path d="M980 320 L795 405" stroke="#62d9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="887.5" y="350.5" fill="#62d9bd" text-anchor="middle" font-family="Arial,sans-serif" font-size="14"></text><rect x="55" y="175" width="330" height="145" rx="12" fill="#122338" stroke="#36546b"/><text x="220.0" y="210" text-anchor="middle" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="18">Studio A · 10.10.0.0/16</text><text x="220.0" y="237" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Private EC2 game client</text><text x="220.0" y="264" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">ssm + ssmmessages endpoints</text><text x="220.0" y="291" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Route table / NACL / security group</text><rect x="815" y="175" width="330" height="145" rx="12" fill="#122338" stroke="#36546b"/><text x="980.0" y="210" text-anchor="middle" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="18">Studio B · 10.20.0.0/16</text><text x="980.0" y="237" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Private asset service · TCP 8080</text><text x="980.0" y="264" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">ssm + ssmmessages endpoints</text><text x="980.0" y="291" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Route table / NACL / security group</text><rect x="405" y="365" width="390" height="105" rx="12" fill="#122338" stroke="#36546b"/><text x="600.0" y="400" text-anchor="middle" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="18">Shared visibility and naming</text><text x="600.0" y="427" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Route 53 private zone / Flow Logs</text><text x="600.0" y="454" text-anchor="middle" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">Reachability Analyzer path</text><text x="50" y="520" fill="#a5b7cc" font-family="Arial,sans-serif" font-size="15">No public IPs, inbound SSH, internet gateway or NAT. Session Manager provides administration.</text></svg>